      <head>

            color: #cc3300;

      <body>
        <div class="login-box">
          <h1>Login</h1>
          <form id="loginForm">
            <label>Email</label>

            <input type="password" id="loginPassword" placeholder="" />
            <input type="submit" value="Submit" id="loginButton" />
          </form>
        </div>
        <p class="para-2">
          Not have an account? <a href="signup.html">Sign Up Here</a>
        </p>
        <script src="javascript/login.js"></script>
